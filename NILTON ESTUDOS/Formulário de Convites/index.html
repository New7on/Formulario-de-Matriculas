<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festivite</title>
  <link rel="stylesheet" href="style/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
      <aside>
    <div class="aside-container"></div>
    <header>
      <img src="assets/icons/Logo.svg" alt="Logo do Festivite">
      <h1>Festivite</h1>
      <p>Crie um convite digital para seu evento</p>
    </header>
  </aside>
    <main>
      <div class="main-container">
        <h1 id="make-invite">
          Crie seu convite
        </h1>
        <form action="" method="post" enctype="multipart/form-data">
<fieldset id="about-the-event" class="about-the-event">

  <legend id="legend-about">
    <img src="assets/icons/calendar.svg" alt="Ícone de um calendário">
    Sobre o evento</legend>

  <div class="input-wrapper">
    <label for="title">Título</label>

    <input 
      type="text" 
      name="title" 
      id="title"
      placeholder="Nome do evento"
      required
    >
  </div>


  <div class="form-row">

    <div class="input-wrapper">
      <label for="start">Início</label>

      <input 
        type="date" 
        name="start" 
        id="start"
        required
      >
    </div>

    <div class="input-wrapper">
      <label for="end">Fim</label>

      <input 
        type="date" 
        name="end" 
        id="end"
        required
      >
    </div>

  </div>


  <div class="form-row">

    <div class="input-wrapper">
      <span class="titulo">Tipo</span>

      <div class="opcoes">

        <input 
          type="radio" 
          name="tipo" 
          id="presencial" 
          value="presencial"
          checked
        >
        <label for="presencial" class="tipo-option">
          <span class="tipo-icone tipo-building" aria-hidden="true"></span>
          <span>Presencial</span>
        </label>

        <input 
          type="radio" 
          name="tipo" 
          id="online" 
          value="online"
        >

        <label for="online" class="tipo-option">
          <span class="tipo-icone tipo-video" aria-hidden="true"></span>
          <span>Online</span>
        </label>

      </div>
    </div>


    <div class="input-wrapper">
      <label for="place">Local</label>

      <input 
        type="text" 
        name="place" 
        id="place"
        placeholder="Link ou endereço"
        required
      >
    </div>

  </div>


  <div class="input-wrapper">
    <label for="description" id="label-textarea">Descrição</label>

    <textarea 
      name="description"
      id="description"
      cols="65"
      rows="10"
      placeholder="Escreva sobre os detalhes do evento">
    </textarea>
  </div>

</fieldset>

<fieldset id="customization" class="customization">
  <legend id="customization-legend">
    <img src="assets/icons/paintbrush.svg" alt="Ícone de pincel">
    Personalização</legend>

  <div class="color-wrapper">
    <span class="input-label">Cor Principal</span>
    <div class="color-options">
      <input
        type="radio"
        name="main-color"
        id="color-cyan"
        value="cyan"
      >
      <label
        for="color-cyan"
        class="color-option cyan">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-navy"
        value="navy"
      >
      <label
        for="color-navy"
        class="color-option navy">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-purple"
        value="purple"
        checked
      >
      <label
        for="color-purple"
        class="color-option purple">
      </label>

       <input
        type="radio"
        name="main-color"
        id="color-fuschia"
        value="fuschia"
      >
      <label
        for="color-fuschia"
        class="color-option fuschia">
      </label>

       <input
        type="radio"
        name="main-color"
        id="color-pink"
        value="pink"
      >
      <label
        for="color-pink"
        class="color-option pink">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-red"
        value="red"
      >
      <label
        for="color-red"
        class="color-option red">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-orange"
        value="orange"
      >
      <label
        for="color-orange"
        class="color-option orange">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-yellow"
        value="yellow"
      >
      <label
        for="color-yellow"
        class="color-option yellow">
      </label>

       <input
        type="radio"
        name="main-color"
        id="color-lime"
        value="lime"
      >
      <label
        for="color-lime"
        class="color-option lime">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-green"
        value="green"
      >
      <label
        for="color-green"
        class="color-option green">
      </label>

</fieldset>
        </form>
      </div>
    </main>
  </div>
  
</body>
</html>
