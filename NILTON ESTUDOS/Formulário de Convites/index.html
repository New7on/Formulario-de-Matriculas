<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festivite</title>
  <link rel="stylesheet" href="style/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
      <aside>
    <div class="aside-container"></div>
    <header>
      <img src="assets/icons/Logo.svg" alt="Logo do Festivite">
      <h1>Festivite</h1>
      <p>Crie um convite digital para seu evento</p>
    </header>
  </aside>
    <main>
      <div class="main-container">
        <h1 id="make-invite">
          Crie seu convite
        </h1>
        <form action="" method="post" enctype="multipart/form-data">
<fieldset id="about-the-event" class="about-the-event">

  <legend id="legend-about">
    <img src="assets/icons/calendar.svg" alt="Ícone de um calendário">
    Sobre o evento</legend>

  <div class="input-wrapper">
    <label for="title">Título</label>

    <input 
      type="text" 
      name="title" 
      id="title"
      placeholder="Nome do evento"
      required
    >
  </div>


  <div class="form-row">

    <div class="input-wrapper">
      <label for="start">Início</label>

      <input 
        type="date" 
        name="start" 
        id="start"
        required
      >
    </div>

    <div class="input-wrapper">
      <label for="end">Fim</label>

      <input 
        type="date" 
        name="end" 
        id="end"
        required
      >
    </div>

  </div>


  <div class="form-row">

    <div class="input-wrapper">
      <span class="titulo">Tipo</span>

      <div class="opcoes">

        <input 
          type="radio" 
          name="tipo" 
          id="presencial" 
          value="presencial"
          checked
        >
        <label for="presencial" class="tipo-option">
          <span class="tipo-icone tipo-building" aria-hidden="true"></span>
          <span>Presencial</span>
        </label>

        <input 
          type="radio" 
          name="tipo" 
          id="online" 
          value="online"
        >

        <label for="online" class="tipo-option">
          <span class="tipo-icone tipo-video" aria-hidden="true"></span>
          <span>Online</span>
        </label>

      </div>
    </div>


    <div class="input-wrapper">
      <label for="place">Local</label>

      <input 
        type="text" 
        name="place" 
        id="place"
        placeholder="Link ou endereço"
        required
      >
    </div>

  </div>

  <div class="input-wrapper">
    <label for="description" id="label-textarea">Descrição</label>
    <textarea 
      name="description"
      id="description"
      cols="65"
      rows="10"
      placeholder="Escreva sobre os detalhes do evento">
    </textarea>
  </div>

</fieldset>

<fieldset id="customization" class="customization">
  <legend id="customization-legend">
    <img src="assets/icons/paintbrush.svg" alt="Ícone de pincel">
    Personalização</legend>

  <div class="color-wrapper">
    <span class="input-label">Cor Principal</span>
    <div class="color-options">
      <input
        type="radio"
        name="main-color"
        id="color-cyan"
        value="cyan"
      >
      <label
        for="color-cyan"
        class="color-option cyan">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-navy"
        value="navy"
      >
      <label
        for="color-navy"
        class="color-option navy">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-purple"
        value="purple"
        checked
      >
      <label
        for="color-purple"
        class="color-option purple">
      </label>

       <input
        type="radio"
        name="main-color"
        id="color-fuschia"
        value="fuschia"
      >
      <label
        for="color-fuschia"
        class="color-option fuschia">
      </label>

       <input
        type="radio"
        name="main-color"
        id="color-pink"
        value="pink"
      >
      <label
        for="color-pink"
        class="color-option pink">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-red"
        value="red"
      >
      <label
        for="color-red"
        class="color-option red">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-orange"
        value="orange"
      >
      <label
        for="color-orange"
        class="color-option orange">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-yellow"
        value="yellow"
      >
      <label
        for="color-yellow"
        class="color-option yellow">
      </label>

       <input
        type="radio"
        name="main-color"
        id="color-lime"
        value="lime"
      >
      <label
        for="color-lime"
        class="color-option lime">
      </label>

      <input
        type="radio"
        name="main-color"
        id="color-green"
        value="green"
      >
      <label
        for="color-green"
        class="color-option green">
      </label>
      </div>  
    </div>
    <div class="event-wrapper">
      <span class="event-label">Tema do evento</span>
      <div class="event-options">
        <input
        type="radio"
        name="main-event"
        id="event-birthday"
        value="birthday"
        checked
      >
      <label
        for="event-birthday"
        class="event-option birthday">
        <img src="assets/birthday.png" alt="Bolo de aniversário">
        <span>Aniversário</span>
      </label>

      <input
        type="radio"
        name="main-event"
        id="event-kids"
        value="infantil"
      >
      <label
        for="event-kids"
        class="event-option kids">
        <img src="assets/kids.png" alt="Festa de aniversário bastante colorida para crianças">
        <span>Infantil</span>
      </label>

      <input
        type="radio"
        name="main-event"
        id="event-graduation"
        value="formatura"
      >
      <label
        for="event-graduation"
        class="event-option graduation">
        <img src="assets/graduation.png" alt="uma beca de formatura">
        <span>Formatura</span>
      </label>

        <input
        type="radio"
        name="main-event"
        id="event-marriage"
        value="casamento"
      >
      <label
        for="event-marriage"
        class="event-option marriage">
        <img src="assets/marriage.png" alt="uma beca de formatura">
        <span>Casamento</span>
      </label>

        <input
        type="radio"
        name="main-event"
        id="event-baby"
        value="baby"
      >
      <label
        for="event-baby"
        class="event-option baby">
        <img src="assets/baby.png" alt="uma fralda ao lado de uma flor">
        <span>Chá de Bebê</span>
      </label>

        <input
        type="radio"
        name="main-event"
        id="event-kitchen"
        value="kitchen"
      >
      <label
        for="event-kitchen"
        class="event-option kitchen">
        <img src="assets/kitchen.png" alt="uma cozinha com utensílios">
        <span>Chá de Panela</span>
      </label>

      <input
        type="radio"
        name="main-event"
        id="event-carnival"
        value="carnival"
      >
      <label
        for="event-carnival"
        class="event-option carnival">
        <img src="assets/carnival.png" alt="Confeites e purpurina no chão">
        <span>Carnaval</span>
      </label>

      <input
        type="radio"
        name="main-event"
        id="event-easter"
        value="easter"
      >
      <label
        for="event-easter"
        class="event-option easter">
        <img src="assets/easter.png" alt="Ovo de páscoa azum com orelhas de coelho e um rostinho feliz desenhando dentro dele">
        <span>Páscoa</span>
      </label>

      <input
        type="radio"
        name="main-event"
        id="event-june"
        value="june"
      >
      <label
        for="event-june"
        class="event-option june">
        <img src="assets/june parties.png" alt="Bandeirolas de são joão esticadas em um ambiente">
        <span>São João</span>
      </label>

      <input
        type="radio"
        name="main-event"
        id="event-halloween"
        value="halloween"
      >
      <label
        for="event-halloween"
        class="event-option halloween">
        <img src="assets/halloween.png" alt="3 Abóboras de halloween com diferentes rostos escupidos">
        <span>halloween</span>
      </label>

      <input
        type="radio"
        name="main-event"
        id="event-christmas"
        value="christmas"
      >
      <label
        for="event-christmas"
        class="event-option christmas">
        <img src="assets/christmas.png" alt="Caixas de presentes com laços na paleta de cores do natal">
        <span>Natal</span>
      </label>

      <input
        type="radio"
        name="main-event"
        id="event-other"
        value="other"
      >
      <label
        for="event-other"
        class="event-option other">
        <img src="assets/other.png" alt="Grupo de pessoas fazendo um brinde">
        <span>Outro</span>
      </label>

      </div>
    </div>

    <div class="style-and-cover">
      <div class="style-wrapper">
      <span class="style-label">Estilo</span>

        <div class="style-control">
          <input
          type="checkbox"
          name="dark-mode"
          id="dark-mode">

          <label
            for="dark-mode"
            class="switch">
            <span class="switch-circle"></span>
          </label>
          <span class="style-name"></span>
        </div>
      </div>

      <div class="cover-wrapper">

        <label
        for="cover"
        class="cover-label">Foto de capa</label>

        <input
        type="file"
        name="cover"
        id="cover"
        accept="image/*"
        required>
      </div>
    </div>
</fieldset>

<fieldset id="contact" class="contact">
  <legend id="contact-legend">
    <img src="assets/icons/contact.png" alt="Ícone de uma pessoa">
    Dados para contato</legend>

    <div class="input-wrapper">
    <label for="name">Nome</label>
    <input 
      type="text" 
      name="name" 
      id="name"
      placeholder="Nome completo"
      required>

      <span id="error-message" class="error-message"> <img src="/assets/icons/error.svg" alt="Ícone de exclamação chamando atenção"> Campo obrigatório</span>
    </div>

    <div class="form-row">
    <div class="input-wrapper">
      <label for="mail">E-mail</label>
      <input 
        type="email" 
        name="mail" 
        id="mail"
        placeholder="exemplo@email.com"
        required>
    </div>

    <div class="input-wrapper">
      <label for="tel">Telefone</label>
      <input 
        type="tel" 
        name="tel" 
        id="tel"
        placeholder="(99) 99999-9999"
        required>
    </div>
  </div>

</fieldset>

<div class="terms">
  <label class="checkbox-wrapper">
    <input
      type="checkbox"
      name="terms"
      id="terms"
      required>

    <span>
      Li e concordo com os
      <a href="#">Termos e Condições</a>
      e com a
      <a href="#">Política de Privacidade</a>
    </span>
  </label>

  <label class="checkbox-wrapper">
    <input
      type="checkbox"
      name="email-updates"
      id="email-updates">

    <span>
      Aceito receber atualizações e promoções por e-mail
    </span>
  </label>

  <label class="checkbox-wrapper">
    <input
      type="checkbox"
      name="sms-updates"
      id="sms-updates">

    <span>
      Aceito receber atualizações e promoções por SMS
    </span>
  </label>
</div>

<div class="form-actions">

  <button type="submit"> <img src="assets/icons/ticket.svg" alt="">Gerar convite</button>

</div>

        </form>
      </div>
    </main>
  </div>
  
</body>
</html>
